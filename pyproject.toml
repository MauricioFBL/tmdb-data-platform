[project]
name = "tmdb-data-platform"
version = "0.1.0"
description = "TMDB data platform — ingestion, Glue/PySpark processing, and dbt Gold marts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,glue]>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
spark = [
    "pyspark>=3.5",
]
dbt = [
    "dbt-athena-community>=1.7",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "glue*"]
