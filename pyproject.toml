[project]
name = "tmdb-data-platform"
version = "0.1.0"
description = "TMDB data platform — ingestion, Glue/PySpark processing, and dbt Silver/Gold (dbt-glue)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,glue]>=5.0",
    "black>=24.0",
    # Pinned to a minor line: ruff's default rule set changes between minors and
    # would otherwise break CI lint without any code change.
    "ruff>=0.17,<0.18",
    "mypy>=1.9",
]
spark = [
    # Pinned to the 3.5.x line to match AWS Glue 5.0's runtime (Spark 3.5.4,
    # Python 3.11 — the Glue version this repo's Python floor implies).
    # Iceberg's spark-runtime artifact is versioned per Spark major.minor,
    # so an unpinned pyspark can silently resolve to a version Glue doesn't
    # run and Iceberg doesn't ship a matching runtime jar for.
    "pyspark>=3.5,<3.6",
]
dbt = [
    # dbt-glue, not dbt-athena: ADR-0004 resolved the dbt engine to Glue (ADR-0005).
    "dbt-glue>=1.9,<2.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "glue*"]
