name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -e ".[dev,spark]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Unit tests
        run: pytest tests/unit ingestion/tests glue/tests -v

      # dbt compile/test deliberately left out until dbt Silver/Gold code
      # exists (Phase 3/6).
