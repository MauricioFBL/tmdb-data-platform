name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Unit tests
        run: pytest tests/unit ingestion/tests -v

      # PySpark-based glue/tests and dbt compile/test are deliberately
      # left out of this initial CI job — added once the corresponding
      # code exists (Phase 1/2/6), to avoid a CI job that fails on an
      # empty scaffold.
